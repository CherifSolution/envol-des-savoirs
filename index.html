<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>L'Envol des Savoirs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap');

:root{
  --cream:#FFF8EA;
  --forest:#2F6B4F;
  --forest-dark:#204A38;
  --sun:#FFC64B;
  --coral:#FF6E5C;
  --sky:#6EC6E8;
  --bark:#5B3E2B;
  --violet:#8E6FC9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; min-height:100vh; font-family:'Nunito',sans-serif;
  background:radial-gradient(circle at 15% 10%, #eafff0 0%, transparent 45%),
             radial-gradient(circle at 85% 90%, #fff3d6 0%, transparent 45%), var(--cream);
  display:flex; justify-content:center;
}
#app{ width:100%; max-width:480px; min-height:100vh; padding:14px 14px 26px; display:flex; flex-direction:column; }
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}

/* ---- header ---- */
header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
.title{ font-family:'Baloo 2',cursive; font-weight:800; font-size:19px; color:var(--forest-dark); display:flex; align-items:center; gap:6px; }
.header-right{ display:flex; align-items:center; gap:6px; }
.pill{ background:white; border-radius:20px; padding:6px 12px; display:flex; align-items:center; gap:5px;
  font-family:'Baloo 2',cursive; font-weight:700; font-size:14px; color:var(--bark); box-shadow:0 3px 0 rgba(0,0,0,0.08); border:none; }

.nav-links{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.navlink{ background:white; border:none; border-radius:14px; padding:6px 10px; font-family:'Baloo 2',cursive;
  font-weight:700; font-size:12px; color:var(--forest-dark); box-shadow:0 2px 0 rgba(0,0,0,0.06); }

/* ---- hearts ---- */
.hearts-row{ font-size:18px; text-align:center; margin:2px 0 8px; letter-spacing:4px; }
.hearts-row.shake{ animation:shake 0.4s; }

/* ---- info pages (mission / about) ---- */
.info-card{ background:white; border-radius:24px; padding:22px 20px; box-shadow:0 5px 0 rgba(0,0,0,0.06); }
.info-card p{ font-size:14.5px; color:#444; line-height:1.6; margin:0 0 12px; }
.info-card h3{ font-family:'Baloo 2',cursive; color:var(--forest-dark); font-size:16px; margin:0 0 10px; }

/* ---- owl mascot (shared) ---- */
.mascot-zone{ display:flex; align-items:flex-end; gap:10px; margin:4px 0 12px; }
.owl{ width:64px; height:64px; flex-shrink:0; position:relative; animation:bob 3s ease-in-out infinite; }
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-2deg);}}
.owl-body{ width:64px; height:64px; background:linear-gradient(180deg,#B08858,#8A6640); border-radius:50% 50% 46% 46%; position:relative; }
.owl-belly{ position:absolute; width:38px; height:42px; background:#F3E3C6; border-radius:50%; left:50%; top:40%; transform:translate(-50%,0); }
.owl-eye{ position:absolute; width:20px; height:20px; background:white; border-radius:50%; top:13px; box-shadow:0 0 0 2px #5B3E2B; }
.owl-eye.left{left:6px;} .owl-eye.right{right:6px;}
.owl-pupil{ position:absolute; width:8px; height:8px; background:#2b2118; border-radius:50%; top:6px; left:6px; }
.owl-beak{ position:absolute; width:0;height:0; left:50%; top:28px; transform:translateX(-50%);
  border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid var(--sun); }
.owl.happy{animation:hop 0.5s ease-in-out 2;}
@keyframes hop{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px) rotate(6deg);}}
.owl.sad{animation:wobble 0.5s ease-in-out;}
@keyframes wobble{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}
.bubble{ background:white; border-radius:14px; padding:9px 13px; font-family:'Baloo 2',cursive; font-weight:700;
  font-size:13.5px; color:var(--forest-dark); box-shadow:0 3px 0 rgba(0,0,0,0.08); position:relative; flex:1; min-height:18px; display:flex; align-items:center; }
.bubble:before{ content:""; position:absolute; left:-7px; bottom:12px; width:0; height:0;
  border-top:7px solid transparent; border-bottom:7px solid transparent; border-right:8px solid white; }

/* ---- onboarding ---- */
.onboard-card{ background:white; border-radius:26px; padding:28px 22px; box-shadow:0 6px 0 rgba(0,0,0,0.07); margin-top:20px; text-align:center; }
.onboard-card h1{ font-family:'Baloo 2',cursive; font-size:24px; color:var(--forest-dark); margin:6px 0 4px; }
.onboard-card p{ font-size:14.5px; color:#666; margin:0 0 20px; }
.field{ text-align:left; margin-bottom:16px; }
.field label{ font-family:'Baloo 2',cursive; font-weight:700; font-size:14px; color:var(--bark); display:block; margin-bottom:6px; }
.field input{ width:100%; padding:12px 14px; border-radius:14px; border:2px solid #eee; font-size:16px; font-family:'Nunito',sans-serif; }
.field input:focus{ outline:none; border-color:var(--forest); }
.big-btn{ width:100%; border:none; background:var(--forest); color:white; font-family:'Baloo 2',cursive; font-weight:800;
  font-size:17px; padding:15px; border-radius:18px; box-shadow:0 4px 0 var(--forest-dark); }
.big-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--forest-dark); }

/* ---- dashboard ---- */
.section-label{ font-family:'Baloo 2',cursive; font-weight:700; font-size:15px; color:var(--forest-dark); margin:14px 0 8px; }
.games-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.game-card{ background:white; border-radius:20px; padding:14px 10px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,0.06); border:none; position:relative; }
.game-card .icon{ font-size:34px; margin-bottom:6px; }
.game-card .name{ font-family:'Baloo 2',cursive; font-weight:700; font-size:13px; color:var(--forest-dark); line-height:1.2; margin-bottom:6px; min-height:32px; display:flex; align-items:center; justify-content:center; }
.dots{ display:flex; justify-content:center; gap:4px; margin-bottom:4px; }
.dot{ width:8px; height:8px; border-radius:50%; background:#e2e2e2; }
.dot.filled{ background:var(--sun); }
.dot.mastered{ background:var(--forest); }
.skill-tag{ font-size:10px; color:#999; }
.bilan-btn{ margin-top:14px; }

/* ---- game screen ---- */
.game-header{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.back-btn{ border:none; background:white; border-radius:50%; width:36px; height:36px; font-size:18px; box-shadow:0 3px 0 rgba(0,0,0,0.08); flex-shrink:0; }
.game-title{ font-family:'Baloo 2',cursive; font-weight:700; font-size:16px; color:var(--forest-dark); flex:1; }
.level-dots{ display:flex; gap:4px; }
.card{ background:white; border-radius:26px; padding:22px 18px 18px; box-shadow:0 6px 0 rgba(0,0,0,0.06); display:flex; flex-direction:column; align-items:center; flex:1; justify-content:center; min-height:260px; }
.stage{ font-size:56px; margin-bottom:14px; text-align:center; line-height:1.2; }
.stage.small-text{ font-size:22px; font-family:'Baloo 2',cursive; color:var(--forest-dark); }
.prompt-text{ font-family:'Baloo 2',cursive; font-weight:700; font-size:16px; color:var(--forest-dark); text-align:center; margin-bottom:18px; }
.options{ width:100%; display:flex; flex-direction:column; gap:10px; }
.opt-btn{ border:none; background:var(--forest); color:white; font-family:'Baloo 2',cursive; font-weight:700; font-size:18px;
  padding:14px 10px; border-radius:16px; box-shadow:0 4px 0 var(--forest-dark); }
.opt-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--forest-dark); }
.opt-btn.correct{ background:#3FA05A; box-shadow:0 4px 0 #2A7A3E; }
.opt-btn.wrong{ background:var(--coral); box-shadow:0 4px 0 #C9483A; }
.opt-btn.dim{ opacity:0.5; }
.opt-btn.shake{ animation:shake 0.4s; }
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.opt-btn.color-swatch{ display:flex; align-items:center; justify-content:center; height:56px; }
.opt-btn .size-emoji{ display:block; }

/* order mechanic */
.built-zone{ min-height:56px; width:100%; background:#F5F1E6; border-radius:14px; display:flex; align-items:center; justify-content:center;
  gap:6px; font-size:24px; margin-bottom:14px; flex-wrap:wrap; padding:8px; }
.bank-zone{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.token-btn{ border:none; background:var(--sky); color:white; font-family:'Baloo 2',cursive; font-weight:700; font-size:20px;
  padding:10px 16px; border-radius:14px; box-shadow:0 3px 0 #4599B8; }
.token-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #4599B8; }
.token-btn.used{ opacity:0.3; pointer-events:none; }
.clear-btn{ margin-top:10px; border:none; background:#eee; color:#777; font-weight:700; font-size:13px; padding:8px 16px; border-radius:12px; }

/* story mechanic */
.story-text{ font-size:15px; color:#333; text-align:center; margin-bottom:18px; line-height:1.5; }
.story-btn{ border:none; background:var(--violet); color:white; font-family:'Baloo 2',cursive; font-weight:700; font-size:15px;
  padding:14px 10px; border-radius:16px; box-shadow:0 4px 0 #6C4F9E; margin-bottom:10px; width:100%; }
.story-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #6C4F9E; }

.burst-star{ position:absolute; font-size:26px; pointer-events:none; animation:flyUp 0.9s ease-out forwards; }
@keyframes flyUp{0%{transform:translateY(0) scale(0.6); opacity:1;}100%{transform:translateY(-90px) scale(1.2); opacity:0;}}

.levelup-banner{ position:fixed; inset:0; background:rgba(47,107,79,0.92); display:flex; flex-direction:column; align-items:center;
  justify-content:center; color:white; text-align:center; padding:30px; z-index:20; }
.levelup-banner h2{ font-family:'Baloo 2',cursive; font-size:28px; margin:8px 0; }
.levelup-banner p{ font-size:15px; margin:0 0 22px; }

/* bilan */
.bilan-row{ background:white; border-radius:16px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; box-shadow:0 3px 0 rgba(0,0,0,0.05); }
.bilan-row .b-icon{ font-size:26px; }
.bilan-row .b-info{ flex:1; }
.bilan-row .b-name{ font-family:'Baloo 2',cursive; font-weight:700; font-size:13.5px; color:var(--forest-dark); }
.bilan-row .b-skill{ font-size:11.5px; color:#999; }
.bar-track{ width:100%; height:8px; background:#eee; border-radius:6px; margin-top:4px; overflow:hidden; }
.bar-fill{ height:100%; background:var(--forest); border-radius:6px; }
.bilan-summary{ background:white; border-radius:20px; padding:18px; margin-bottom:14px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,0.06); }
.bilan-summary .pct{ font-family:'Baloo 2',cursive; font-weight:800; font-size:38px; color:var(--forest); }
.bilan-summary p{ font-size:13.5px; color:#666; margin:6px 0 0; }
</style>
</head>

function overallProgressPct(){
  const games = GAMES.filter(g => g.ageGroup === profile.ageGroup);
  let total = 0;
  games.forEach(g => { const p = profile.progress[g.id]; total += p.mastered ? 3 : Math.min(p.level,3); });
  return Math.round((total/(games.length*3))*100);
}
function motivationalLine(){
  const pct = overallProgressPct();
  const pool = pct >= 70 ? QUOTES_MASTER : (pct >= 25 ? QUOTES_PROGRESS : QUOTES_START);
  return pool[Math.floor(Math.random()*pool.length)];
}
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function speak(text){
  try{ window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=0.9; u.pitch=1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

/* ============================= AUDIO ENGINE ============================= */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, start, dur, type, gainVal){
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  gain.gain.setValueAtTime(gainVal, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start+dur);
  osc.start(start); osc.stop(start+dur);
}
function playCorrectSound(level){
  const ctx = getCtx(); const t = ctx.currentTime;
  const melodies = {
    1: [523.25,659.25],
    2: [523.25,659.25,783.99],
    3: [523.25,659.25,783.99,1046.5],
    4: [523.25,659.25,783.99,1046.5,1318.5]
  };
  const notes = melodies[level] || melodies[1];
  notes.forEach((f,i)=> playTone(f, t+i*0.09, 0.2, 'triangle', 0.16));
}
function playWrongSound(){
  const ctx = getCtx(); const t = ctx.currentTime;
  [320,220].forEach((f,i)=> playTone(f, t+i*0.13, 0.24, 'sawtooth', 0.11));
}

const MUSIC = {
  '2-5': { notes:[523.25,587.33,659.25,587.33,523.25,659.25,783.99,659.25], tempo:480, type:'sine' },
  '5-7': { notes:[440.00,493.88,523.25,587.33,523.25,493.88,440.00,392.00], tempo:400, type:'triangle' },
  '7-10':{ notes:[349.23,392.00,440.00,493.88,523.25,493.88,440.00,392.00], tempo:340, type:'triangle' }
};
let musicOn = false, musicInterval = null, musicStep = 0;
function startMusic(){
  stopMusic();
  const conf = MUSIC[profile.ageGroup];
  musicStep = 0;
  musicInterval = setInterval(() => {
    const ctx = getCtx();
    playTone(conf.notes[musicStep % conf.notes.length], ctx.currentTime, conf.tempo/1000*0.9, conf.type, 0.05);
    musicStep++;
  }, conf.tempo);
}
function stopMusic(){ if(musicInterval) clearInterval(musicInterval); musicInterval = null; }
function toggleMusic(){
  musicOn = !musicOn;
  if(musicOn) startMusic(); else stopMusic();
  document.querySelectorAll('.music-btn').forEach(b => b.textContent = musicOn ? '🔊' : '🔈');
}

/* ============================= HEARTS ============================= */
let hearts = 3;
function resetHearts(){ hearts = 3; renderHearts(); }
function renderHearts(){
  const el = document.getElementById('heartsRow');
  if(!el) return;
  el.textContent = Array.from({length:3}, (_,i) => i < hearts ? '❤️' : '🤍').join(' ');
}
function loseHeart(){
  if(hearts <= 0) return;
  hearts--;
  renderHearts();
  const el = document.getElementById('heartsRow');
  if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'), 400); }
  if(hearts <= 0){
    const zone = document.getElementById('cardZone');
    if(zone) zone.dataset.locked = '1';
    const prog = profile.progress[currentGame.id];
    prog.correctAtLevel = 0;
    saveProfile();
    setTimeout(() => {
      showLevelUpBanner('Niveau à refaire ! 💪', `Plus de cœurs ! On reprend le niveau ${prog.level} depuis le début, tu vas y arriver !`,
        () => { resetHearts(); renderGameShell(); nextRound(); });
    }, 500);
  }
}

/* ============================= PERSISTENCE ============================= */
async function saveProfile(){
  try{ await window.storage.set('profile:'+profile.name, JSON.stringify(profile), false); }catch(e){}
}
async function loadLastProfile(){
  try{
    const last = await window.storage.get('last-profile', false);
    if(!last) return null;
    const p = await window.storage.get('profile:'+last.value, false);
    return p ? JSON.parse(p.value) : null;
  }catch(e){ return null; }
}
async function setLastProfile(name){
  try{ await window.storage.set('last-profile', name, false); }catch(e){}
}

function emptyProgress(){
  const prog = {};
  GAMES.forEach(g => prog[g.id] = { level:1, correctAtLevel:0, mastered:false, storyDone:false });
  return prog;
}

function renderOnboarding(){
  app.innerHTML = `
    <div class="title">🌳 La Forêt des Savoirs</div>
    <div class="onboard-card">
      <div style="font-size:44px;">🦉</div>
      <h1>Bienvenue !</h1>
      <p>Dis-moi qui tu es pour que je te propose les bons jeux.</p>
      <div class="field">
        <label>Prénom de l'enfant</label>
        <input type="text" id="inName" placeholder="Ex: Emma" maxlength="30">
        <div id="nameError" style="color:#E74C3C; font-size:12.5px; margin-top:5px; display:none;">Le prénom ne doit contenir que des lettres (2 à 30 caractères, sans chiffre ni symbole).</div>
      </div>
      <div class="field">
        <label>Âge</label>
        <input type="number" id="inAge" min="2" max="10" placeholder="Ex: 6">
      </div>
      <button class="big-btn" id="startBtn">Commencer l'aventure</button>
    </div>
  `;
  const nameRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ' -]{2,30}$/;
  const inName = document.getElementById('inName');
  const nameError = document.getElementById('nameError');
  inName.addEventListener('input', () => {
    inName.value = inName.value.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' -]/g, '');
    nameError.style.display = 'none';
  });
  document.getElementById('startBtn').addEventListener('click', async () => {
    const name = inName.value.trim();
    if(!nameRegex.test(name)){ nameError.style.display = 'block'; return; }
    let age = parseInt(document.getElementById('inAge').value, 10);
    if(isNaN(age)) age = 5;
    age = Math.max(2, Math.min(10, age));

    let existing = null;
    try{
      const p = await window.storage.get('profile:'+name, false);
      if(p) existing = JSON.parse(p.value);
    }catch(e){}

    profile = existing || { name, age, ageGroup: ageGroupFor(age), progress: emptyProgress() };
    profile.age = age;
    profile.ageGroup = ageGroupFor(age);
    await saveProfile();
    await setLastProfile(name);
    renderDashboard();
  });
}

        <div class="owl-eye left"><div class="owl-pupil"></div></div>
        <div class="owl-eye right"><div class="owl-pupil"></div></div>
        <div class="owl-beak"></div></div>
      </div>
      <div class="bubble">Bienvenue ${profile.name} ! 🌟 ${motivationalLine()}</div>
    </div>
    <div class="section-label">Tes jeux</div>
    <div class="games-grid" id="grid"></div>
    <button class="big-btn bilan-btn" id="bilanBtn">📊 Mon bilan</button>
  `;
  const grid = document.getElementById('grid');
  games.forEach(g => {
    const prog = profile.progress[g.id];
    const lvl = prog.mastered ? 3 : prog.level;
    let dotsHtml = '';
    for(let i=1;i<=3;i++){
      const cls = prog.mastered ? 'dot mastered' : (i <= (prog.level-1) || (i===prog.level && prog.correctAtLevel>=LEVEL_UP_THRESHOLD) ? 'dot filled' : (i===prog.level?'dot filled':'dot'));
      dotsHtml += `<div class="${i < prog.level || prog.mastered ? 'dot mastered' : (i===prog.level?'dot filled':'dot')}"></div>`;
    }
    const card = document.createElement('button');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="icon">${g.icon}</div>
      <div class="name">${g.title}</div>
      <div class="dots">${dotsHtml}</div>
      <div class="skill-tag">${prog.mastered ? 'Maîtrisé ⭐' : 'Niveau '+prog.level+'/3'}</div>
    `;
    card.addEventListener('click', () => openGame(g.id));
    grid.appendChild(card);
  });
  document.getElementById('switchBtn').addEventListener('click', renderOnboarding);
  document.getElementById('bilanBtn').addEventListener('click', renderBilan);
  document.getElementById('missionBtn').addEventListener('click', renderMission);
  document.getElementById('aboutBtn').addEventListener('click', renderAbout);
  document.getElementById('musicBtn').addEventListener('click', toggleMusic);
}

/* ============================= INFO PAGES ============================= */
function renderMission(){
  app.innerHTML = `
    <div class="game-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="game-title">🎯 Notre objectif</div>
    </div>
    <div class="info-card">
      <div style="font-size:44px; text-align:center; margin-bottom:10px;">🦉</div>
      <h3>Pourquoi L'Envol des Savoirs ?</h3>
      <p>Trop d'enfants associent l'apprentissage à l'ennui ou à la pression scolaire. L'Envol des Savoirs part d'une conviction simple : un enfant apprend mieux quand il s'amuse, qu'il avance à son propre rythme, et qu'il se sent fier de ses progrès plutôt que jugé sur ses erreurs.</p>
      <h3>Comment ça marche ?</h3>
      <p>L'application s'adapte automatiquement à l'âge de l'enfant (2 à 5 ans, 5 à 7 ans, ou 7 à 10 ans) et propose des jeux courts couvrant la lecture, le calcul, la logique, les sciences et la culture générale. Chaque jeu compte 3 niveaux : l'enfant progresse en réussissant des bonnes réponses, et peut rejouer autant de fois qu'il le souhaite pour consolider ce qu'il apprend.</p>
      <h3>Le droit à l'erreur</h3>
      <p>Le système des cœurs permet à l'enfant de se tromper sans crainte : perdre ses trois cœurs signifie simplement recommencer le niveau avec le sourire, pas un échec. L'objectif n'est jamais la performance, mais la persévérance.</p>
      <h3>Un bilan pour avancer</h3>
      <p>À tout moment, un bilan visuel permet à l'enfant (et à ses parents) de voir où il en est dans chaque domaine, pour célébrer les réussites et savoir où continuer à s'entraîner.</p>
      <h3>Pour qui ?</h3>
      <p>Pour tous les enfants de 2 à 10 ans, à la maison comme en complément de l'école, et pour tous les parents qui veulent offrir à leur enfant un moment d'apprentissage aussi joyeux qu'un moment de jeu.</p>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderDashboard);
}

/* ============================= GAME ENGINE ============================= */
function openGame(id){
  currentGame = GAMES.find(g => g.id === id);
  builtSeq = []; usedTokenIdx = [];
  if(currentGame.mechanic === 'story'){
    currentGame._storyKey = currentGame.tree.start;
    renderStoryScreen();
  } else {
    hearts = 3;
    renderGameShell();
    nextRound();
  }
}

function renderGameShell(){
  const prog = profile.progress[currentGame.id];
  let dotsHtml='';
  for(let i=1;i<=3;i++) dotsHtml += `<div class="dot ${i<prog.level||prog.mastered?'mastered':(i===prog.level?'filled':'')}"></div>`;
  app.innerHTML = `
    <div class="game-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="game-title">${currentGame.icon} ${currentGame.title}</div>
      <div class="level-dots">${dotsHtml}</div>
      <button class="pill music-btn" id="musicBtn" style="padding:6px 8px;">${musicOn ? '🔊' : '🔈'}</button>
    </div>
    <div class="hearts-row" id="heartsRow"></div>
    <div class="card" id="cardZone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderDashboard);
  document.getElementById('musicBtn').addEventListener('click', toggleMusic);
  renderHearts();
}

function currentLevelIndex(){
  const prog = profile.progress[currentGame.id];
  return Math.min(prog.level, 3) - 1;
}

function nextRound(){
  const g = currentGame;
  const li = currentLevelIndex();

  if(g.mechanic === 'choice' || g.mechanic === 'choice-color' || g.mechanic === 'choice-size'){
    const pool = g.levels[li];
    currentRound = pool[Math.floor(Math.random()*pool.length)];
    renderChoiceRound();
  } else if(g.mechanic === 'gen-count'){
    const [mn,mx] = g.ranges[li];
    const n = randInt(mn,mx);
    let d1 = n, d2 = n;
    while(d1===n) d1 = Math.max(1, n + (Math.random()<0.5?-1:1)*randInt(1,2));
    while(d2===n || d2===d1) d2 = Math.max(1, n + (Math.random()<0.5?-2:2)*randInt(1,2));
    currentRound = { prompt:'Combien vois-tu d\'étoiles ?', stage:'⭐'.repeat(n),
      options: shuffle([{v:String(n),ok:1},{v:String(d1),ok:0},{v:String(d2),ok:0}]) };
    renderChoiceRound();
  } else if(g.mechanic === 'gen-addition'){
    const [mn,mx] = g.ranges[li];
    const a = randInt(mn,mx), b = randInt(mn,mx), sum = a+b;
    let d1 = sum+randInt(1,3), d2 = Math.max(0,sum-randInt(1,3));
    if(d2===sum) d2 = sum+4;
    const stage = mx<=5 ? '🍎'.repeat(a)+' + '+'🍎'.repeat(b) : (a+' + '+b);
    currentRound = { prompt:'Combien cela fait-il en tout ?', stage,
      options: shuffle([{v:String(sum),ok:1},{v:String(d1),ok:0},{v:String(d2),ok:0}]) };
    renderChoiceRound();
  } else if(g.mechanic === 'gen-mult'){
    const tables = g.tablesByLevel[li];
    const b = tables[randInt(0,tables.length-1)];
    const a = randInt(1,10);
    const correct = a*b;
    let d1 = correct + b, d2 = Math.max(0, correct - b);
    if(d2===correct) d2 = correct + b*2;
    currentRound = { prompt:`${a} × ${b} = ?`, stage:'✖️',
      options: shuffle([{v:String(correct),ok:1},{v:String(d1),ok:0},{v:String(d2),ok:0}]) };
    renderChoiceRound();
  } else if(g.mechanic === 'gen-guess'){
    const [mn,mx,win] = g.ranges[li];
    const secret = randInt(mn,mx);
    const lo = Math.max(mn, secret-win), hi = Math.min(mx, secret+win);
    let d1 = secret+1 > mx ? secret-1 : secret+1;
    let d2 = secret-2 < mn ? secret+2 : secret-2;
    if(d2===d1) d2 = secret+3<=mx?secret+3:secret-3;
    currentRound = { prompt:`Je pense à un nombre entre ${lo} et ${hi}. Lequel est-ce ?`, stage:'🔍',
      options: shuffle([{v:String(secret),ok:1},{v:String(d1),ok:0},{v:String(d2),ok:0}]) };
    renderChoiceRound();
  } else if(g.mechanic === 'order'){
    const pool = g.levels[li];
    currentRound = pool[Math.floor(Math.random()*pool.length)];
    builtSeq = []; usedTokenIdx = [];
    renderOrderRound();
  } else if(g.mechanic === 'order-code'){
    const pool = g.levels[li];
    currentRound = pool[Math.floor(Math.random()*pool.length)];
    builtSeq = []; usedTokenIdx = [];
    renderCodeRound();
  }
}

/* ---- choice rendering ---- */
function renderChoiceRound(){
  const zone = document.getElementById('cardZone');
  const g = currentGame, r = currentRound;

  if(g.mechanic === 'choice-color'){
    zone.innerHTML = `
      <div class="stage">🎨</div>
      <div class="prompt-text">Trouve le ${r.name}</div>
      <div class="options" id="optsZone"></div>
    `;
    const optsZone = document.getElementById('optsZone');
    shuffle(r.options).forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt-btn color-swatch';
      b.style.background = o.c;
      b.addEventListener('click', () => handleChoice(b, o.n === r.name));
      optsZone.appendChild(b);
    });
    return;
  }

  if(g.mechanic === 'choice-size'){
    const sizes = shuffle([36,60,96]);
    const targetIdx = {petit:0, moyen:1, grand:2}[r.ask];
    zone.innerHTML = `
      <div class="stage">${r.emoji}</div>
      <div class="prompt-text">${r.prompt}</div>
      <div class="options" id="optsZone" style="flex-direction:row; justify-content:space-around; align-items:flex-end;"></div>
    `;
    const optsZone = document.getElementById('optsZone');
    sizes.forEach(sz => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.style.background = 'white';
      b.style.boxShadow = '0 3px 0 rgba(0,0,0,0.08)';
      b.innerHTML = `<span class="size-emoji" style="font-size:${sz}px;">${r.emoji}</span>`;
      b.addEventListener('click', () => handleChoice(b, sz === sizes[targetIdx]));
      optsZone.appendChild(b);
    });
    return;
  }

  // generic choice
  const stageClass = /^[0-9🟧⬜/]+$/.test(r.stage||'') && r.stage && r.stage.length>4 ? 'stage small-text' : 'stage';
  zone.innerHTML = `
    <div class="${stageClass}">${r.stage||''}</div>
    <div class="prompt-text">${r.prompt}</div>
    <div class="options" id="optsZone"></div>
  `;
  if(g.speakStage && r.speak) setTimeout(()=>speak(r.speak), 300);
  const optsZone = document.getElementById('optsZone');
  shuffle(r.options).forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = o.v;
    b.addEventListener('click', () => handleChoice(b, !!o.ok));
    optsZone.appendChild(b);
  });
}

function handleChoice(btn, isCorrect){
  const zone = document.getElementById('cardZone');
  if(zone.dataset.locked) return;
  if(isCorrect){
    zone.dataset.locked = '1';
    btn.classList.add('correct');
    document.querySelectorAll('.opt-btn').forEach(b=>{ if(b!==btn) b.classList.add('dim'); });
    burst(zone);
    onCorrect();
  } else {
    btn.classList.add('wrong','shake');
    playWrongSound();
    loseHeart();
    setTimeout(()=> btn.classList.remove('wrong','shake'), 450);
  }
}

/* ---- order rendering (syllables / timeline) ---- */
function renderOrderRound(){
  const zone = document.getElementById('cardZone');
  const g = currentGame, r = currentRound;
  const items = g.isTimeline ? r.items : r.syl;
  const shuffled = shuffle(items.map((v,i)=>({v,i})));
  const promptText = g.isTimeline ? 'Remets ces évènements dans l\'ordre (du plus ancien au plus récent)'
                                  : `Reconstitue le mot : ${r.word}`;
  zone.innerHTML = `
    ${g.isTimeline ? '' : `<div class="stage">${r.emoji}</div>`}
    <div class="prompt-text">${promptText}</div>
    <div class="built-zone" id="builtZone"></div>
    <div class="bank-zone" id="bankZone"></div>
    <button class="clear-btn" id="clearBtn">Recommencer</button>
  `;
  const bank = document.getElementById('bankZone');
  shuffled.forEach((item, idx) => {
    const b = document.createElement('button');
    b.className = 'token-btn';
    b.textContent = item.v;
    b.dataset.origIdx = item.i;
    b.dataset.bankIdx = idx;
    b.addEventListener('click', () => handleOrderTap(b, item.i, items));
    bank.appendChild(b);
  });
  document.getElementById('clearBtn').addEventListener('click', () => { builtSeq=[]; usedTokenIdx=[]; renderOrderRound(); });
  renderBuiltZone();
}

function renderBuiltZone(){
  const bz = document.getElementById('builtZone');
  bz.textContent = builtSeq.length ? builtSeq.join(g_isSyllable() ? '' : ' → ') : '...';
}
function g_isSyllable(){ return currentGame.mechanic==='order' && !currentGame.isTimeline; }

function handleOrderTap(btn, origIdx, items){
  const zone = document.getElementById('cardZone');
  if(zone.dataset.locked) return;
  const expectedIdx = builtSeq.length;
  if(origIdx === expectedIdx){
    builtSeq.push(items[origIdx]);
    btn.classList.add('used');
    renderBuiltZone();
    if(builtSeq.length === items.length){
      zone.dataset.locked = '1';
      burst(zone);
      onCorrect();
    }
  } else {
    btn.classList.add('shake');
    playWrongSound();
    loseHeart();
    setTimeout(()=>btn.classList.remove('shake'), 400);
  }
}

/* ---- order-code rendering (codeur en herbe) ---- */
function renderCodeRound(){
  const zone = document.getElementById('cardZone');
  const r = currentRound;
  const blocks = ['⬆️','➡️','⬅️'];
  zone.innerHTML = `
    <div class="stage">🤖 → 🍎</div>
    <div class="prompt-text">Compose le chemin du robot jusqu'à la pomme</div>
    <div class="built-zone" id="builtZone">...</div>
    <div class="bank-zone" id="bankZone"></div>
    <button class="clear-btn" id="clearBtn">Recommencer</button>
  `;
  const bank = document.getElementById('bankZone');
  blocks.forEach(sym => {
    const b = document.createElement('button');
    b.className = 'token-btn';
    b.textContent = sym;
    b.addEventListener('click', () => handleCodeTap(sym, r.target));
    bank.appendChild(b);
  });
  document.getElementById('clearBtn').addEventListener('click', () => { builtSeq=[]; renderCodeRound(); });
}

function handleCodeTap(sym, target){
  const zone = document.getElementById('cardZone');
  if(zone.dataset.locked) return;
  const expected = target[builtSeq.length];
  if(sym === expected){
    builtSeq.push(sym);
    document.getElementById('builtZone').textContent = builtSeq.join(' ');
    if(builtSeq.length === target.length){
      zone.dataset.locked = '1';
      burst(zone);
      onCorrect();
    }
  } else {
    document.getElementById('builtZone').classList.add('shake');
    playWrongSound();
    loseHeart();
    setTimeout(()=>document.getElementById('builtZone').classList.remove('shake'), 400);
  }
}

/* ---- story rendering ---- */
function renderStoryScreen(){
  const g = currentGame;
  const key = g._storyKey;
  const isEnding = !!g.tree.endings[key];
  app.innerHTML = `
    <div class="game-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="game-title">${g.icon} ${g.title}</div>
    </div>
    <div class="card" id="cardZone">
      <div class="stage">${isEnding ? '🎉' : '📖'}</div>
      <div class="story-text">${isEnding ? g.tree.endings[key] : g.tree.steps[key].text}</div>
      <div id="storyOpts"></div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderDashboard);
  const optsZone = document.getElementById('storyOpts');
  if(isEnding){
    const prog = profile.progress[g.id];
    if(!prog.storyDone){ prog.storyDone = true; prog.mastered = true; prog.level = 3; saveProfile(); }
    const btn = document.createElement('button');
    btn.className = 'story-btn';
    btn.textContent = 'Recommencer l\'histoire';
    btn.addEventListener('click', () => { g._storyKey = g.tree.start; renderStoryScreen(); });
    optsZone.appendChild(btn);
  } else {
    g.tree.steps[key].options.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'story-btn';
      btn.textContent = o.label;
      btn.addEventListener('click', () => { g._storyKey = o.next; renderStoryScreen(); });
      optsZone.appendChild(btn);
    });
  }
}

/* ---- shared: correct answer / level progression ---- */
function burst(zone){
  for(let i=0;i<5;i++){
    const s = document.createElement('div');
    s.className = 'burst-star'; s.textContent = '⭐';
    s.style.left = (40+Math.random()*20)+'%'; s.style.top = (30+Math.random()*10)+'%';
    s.style.animationDelay = (i*0.05)+'s';
    zone.style.position = 'relative';
    zone.appendChild(s);
    setTimeout(()=>s.remove(), 1000);
  }
}

function onCorrect(){
  const prog = profile.progress[currentGame.id];
  playCorrectSound(prog.mastered ? 4 : prog.level);
  speak('Bravo !');
  prog.correctAtLevel++;
  let leveledUp = false, justMastered = false;
  if(prog.correctAtLevel >= LEVEL_UP_THRESHOLD){
    if(prog.level < 3){ prog.level++; prog.correctAtLevel = 0; leveledUp = true; }
    else if(!prog.mastered){ prog.mastered = true; justMastered = true; }
  }
  saveProfile();
  setTimeout(() => {
    if(justMastered) showLevelUpBanner('Jeu maîtrisé ! 🏆', `Tu maîtrises « ${currentGame.title} » !`, () => renderDashboard());
    else if(leveledUp) showLevelUpBanner('Niveau supérieur ! 🎉', `Tu passes au niveau ${prog.level} !`, () => { resetHearts(); renderGameShell(); nextRound(); });
    else { renderGameShell(); nextRound(); }
  }, 900);
}

function showLevelUpBanner(title, msg, onContinue){
  const b = document.createElement('div');
  b.className = 'levelup-banner';
  b.innerHTML = `<div style="font-size:56px;">🎊</div><h2>${title}</h2><p>${msg}</p><button class="big-btn" id="contBtn" style="width:auto; padding:14px 34px;">Continuer</button>`;
  document.body.appendChild(b);
  document.getElementById('contBtn').addEventListener('click', () => { b.remove(); onContinue(); });
}

/* ============================= BILAN ============================= */
function renderBilan(){
  const games = GAMES.filter(g => g.ageGroup === profile.ageGroup);
  let totalLevel = 0;
  const rows = games.map(g => {
    const prog = profile.progress[g.id];
    const lvl = prog.mastered ? 3 : (prog.level - (prog.correctAtLevel>0?0:0));
    totalLevel += Math.min(lvl,3);
    const pct = Math.round((Math.min(lvl,3)/3)*100);
    return `
      <div class="bilan-row">
        <div class="b-icon">${g.icon}</div>
        <div class="b-info">
          <div class="b-name">${g.title}</div>
          <div class="b-skill">${g.skill}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
        </div>
      </div>`;
  }).join('');
  const overallPct = Math.round((totalLevel/(games.length*3))*100);
  let msg = 'Continue à explorer les jeux pour progresser !';
  if(overallPct >= 80) msg = `${profile.name} maîtrise très bien cette tranche d'âge, bravo !`;
  else if(overallPct >= 40) msg = `${profile.name} progresse bien, encore un peu d'entraînement !`;
  app.innerHTML = `
    <div class="game-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="game-title">📊 Bilan de ${profile.name}</div>
    </div>
    <div class="bilan-summary">
      <div class="pct">${overallPct}%</div>
      <p>${msg}</p>
    </div>
    <div class="section-label">Détail par jeu</div>
    ${rows}
  `;
  document.getElementById('backBtn').addEventListener('click', renderDashboard);
}

/* ============================= BOOT ============================= */
(async function boot(){
  const last = await loadLastProfile();
  if(last){ profile = last; renderDashboard(); }
  else { renderOnboarding(); }
})();
</script>
